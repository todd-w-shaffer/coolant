name: Auto-release thermal binary

on:
  push:
    branches: [main]
    paths:
      - 'thermal/**'
      - 'scripts/**'
      - 'hooks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: thermal/go.mod
          cache-dependency-path: thermal/go.sum

      - name: Compute next version
        id: bump
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.4.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "bare=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Stamp VERSION and statusline
        run: |
          echo "${{ steps.bump.outputs.bare }}" > VERSION
          sed -i '' "s/^# VERSION: .*$/# VERSION: ${{ steps.bump.outputs.bare }}/" claude-statusline/statusline.sh
          sed -i '' "s/^COOLANT_INSTALLED_VERSION=.*$/COOLANT_INSTALLED_VERSION=\"${{ steps.bump.outputs.bare }}\"/" claude-statusline/statusline.sh

      - name: Build binaries
        working-directory: thermal
        env:
          VERSION: ${{ steps.bump.outputs.bare }}
        run: |
          LDFLAGS="-X github.com/toddwshaffer/coolant/thermal/internal/version.Version=${VERSION}"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o ../bin/thermo-darwin-arm64 ./cmd/thermal/
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ../bin/thermo-darwin-amd64 ./cmd/thermal/

      - name: Commit version stamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION claude-statusline/statusline.sh
          git commit -m "chore: stamp version ${{ steps.bump.outputs.bare }}" || true
          git push origin main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            bin/thermo-darwin-arm64 \
            bin/thermo-darwin-amd64 \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
