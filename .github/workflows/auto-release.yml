name: Auto-release thermal binary

on:
  push:
    branches: [main]
    paths:
      - 'thermal/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: thermal/go.mod
          cache-dependency-path: thermal/go.sum

      - name: Compute next version
        id: bump
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.4.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Build binaries
        working-directory: thermal
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -o ../bin/thermo-darwin-arm64 ./cmd/thermal/
          CGO_ENABLED=1 GOARCH=amd64 go build -o ../bin/thermo-darwin-amd64 ./cmd/thermal/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            bin/thermo-darwin-arm64 \
            bin/thermo-darwin-amd64 \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
