# Prometheus config for Claude Code OTEL dogfooding
# Claude Code pushes metrics directly via OTLP — no scrape targets needed.
# Start with: prometheus --enable-feature=otlp-write-receiver --config.file=prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# No scrape_configs needed — Claude Code pushes via OTLP to
# /api/v1/otlp/v1/metrics (enabled by --enable-feature=otlp-write-receiver)
