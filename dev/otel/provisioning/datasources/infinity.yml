apiVersion: 1

# Infinity data source — serves static CSV color lookups for panels
# whose series labels are data (org_id, repo). Joined into panels via
# the "Config from query results" transform so Grafana binds each
# series to its Frappe accent at render time. Pure JSON, no recompile.
datasources:
  - name: Infinity
    uid: infinity
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      global_queries:
        - name: org_colors
          id: org_colors
          query:
            type: csv
            source: url
            parser: backend
            format: table
            url: http://localhost:9091/org_colors.csv
            url_options:
              method: GET
            columns:
              - { selector: "name",  text: "name",  type: "string" }
              - { selector: "color", text: "color", type: "string" }
        - name: repo_colors
          id: repo_colors
          query:
            type: csv
            source: url
            parser: backend
            format: table
            url: http://localhost:9091/repo_colors.csv
            url_options:
              method: GET
            columns:
              - { selector: "name",  text: "name",  type: "string" }
              - { selector: "color", text: "color", type: "string" }
